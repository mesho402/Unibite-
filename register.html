<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
  <title>Register</title>
  <style>
    :root {
      --green: #93BE55;
      --blue: #2672C3;
      --text: #391713;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "League Spartan", sans-serif;
    }

    body {
      height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      background: var(--blue);
      overflow: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 70px 25px 20px;
      color: white;
    }

    .header h1 {
      font-size: 26px;
      font-weight: 700;
      text-align: center;
      flex: 1;
    }

    .back {
      font-size: 28px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }

    .spacer { width: 28px; }

    .panel {
      background: #fff;
      flex: 1;
      border-top-left-radius: 60px;
      border-top-right-radius: 60px;
      margin-top: 40px;
      padding: 80px 40px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--text);
    }

    h2 { font-size: 22px; margin-bottom: 25px; color: var(--text); }

    label {
      align-self: flex-start;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      background: var(--blue);
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 15px;
      color: var(--text);
      margin-bottom: 18px;
      outline: none;
    }

    input::placeholder { color: var(--text); opacity: 0.8; }

    .password-container {
      width: 100%;
      position: relative;
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      top: 35%;
      transform: translateY(-50%);
      cursor: pointer;
    }

    .register-btn {
      width: 100%;
      background: var(--green);
      color: white;
      border: none;
      border-radius: 30px;
      padding: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }

    .login-text {
      margin-top: 30px;
      text-align: center;
      font-size: 13px;
      color: var(--text);
    }

    .login-text a {
      color: var(--green);
      text-decoration: none;
      font-weight: 600;
    }

    .msg {
      width: 100%;
      background: #ffcccc;
      color: #391713;
      font-size: 14px;
      text-align: center;
      padding: 8px 0;
      border-radius: 8px;
      margin-bottom: 12px;
      font-weight: 600;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="back" onclick="history.back()">&lt;</div>
    <h1>New Account</h1>
    <div class="spacer"></div>
  </div>

  <div class="panel">
  <form action="regist_auth.php" method="POST">

    <h2>Create Account</h2>
    
    <label>Full Name</label>
    <input type="text" id="fullname" placeholder="Sarah" name="name">
    
    <label>Email</label>
    <input type="email" id="email" placeholder="example@example.com" name="email">
    
    <label>Mobile Number</label>
    <input type="text" id="phone" placeholder="+966123456789" name="phone">
    
    <label>Password</label>
    <div class="password-container">
      <input type="password" id="password" placeholder="***********" name="password">
      <img src="imgs/icons/showoff.png" class="toggle-password" onclick="togglePassword()">
    </div>

    <div class="msg" style="display:none;"></div>
    <button type="submit" class="register-btn">Sign Up</button>
    
  </form>

    <div class="login-text">
      Already have an account? <a href="login.html">Log In</a>
    </div>
  </div>

  <script>
    function togglePassword() {
      const p = document.getElementById("password");
      p.type = p.type === "password" ? "text" : "password";
    }

    function showMessage(text) {
      const msg = document.querySelector(".msg");
      msg.textContent = text;
      msg.style.display = "block";
      setTimeout(() => msg.style.display = "none", 2000);
    }

    document.getElementById("registerBtn").addEventListener("click", function() {
      const name = document.getElementById("fullname").value.trim();
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!name || !email || !phone || !password) {
        showMessage("Please fill in all fields.");
        return;
      }

      const isEmailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      const isPhoneValid = /^(\+?\d{10,15})$/.test(phone);

      if (!isEmailValid) {
        showMessage("Enter a valid email address.");
        return;
      }

      if (!isPhoneValid) {
        showMessage("Enter a valid phone number.");
        return;
      }

      localStorage.setItem("loggedIn", "true");
      window.location.href = "index.php";
    });
  </script>
</body>
</html>
