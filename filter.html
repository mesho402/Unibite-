<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
  <title>Filter</title>
  <style>
    :root{
      --green:#93BE55;
      --blue:#2672C3;
      --brown:#391713;
      --white:#fff;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: "League Spartan", sans-serif;
      background:var(--blue);
      -webkit-font-smoothing:antialiased;
      /* direction: rtl; */
    }

    /* ===== top blue header (مطابق للصفحات الأخرى) ===== */
    .top-bar{
      background:var(--blue);
      color:var(--white);
      padding:35px 16px 40px; /* نفس البادينج المستخدم في الصفحات */
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      height:auto;
    }
    .top-bar .title{
      font-weight:700;
      font-size:20px;
      letter-spacing:0.2px;
    }
    .back-btn{
      position:absolute;
      left:16px; /* أقصى الشمال بصريًا (rtl ينعكس) */
      top:50%;
      transform:translateY(-50%);
      background:none;
      border:none;
      color:var(--white);
      font-size:26px;
      width:44px;
      height:44px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:50%;
      cursor:pointer;
    }

    /* ===== main white sheet ===== */
    .filter-container{
      background: #fff;
      border-top-left-radius: 30px;
      border-top-right-radius: 30px;
      padding: 26px 20px 100px;
      color: #391713;
      margin-top: 0; /* شيل السالب */
      position: relative;
      top: -10px;
      z-index: 2;
    }

    h3{
      margin:0 0 10px;
      font-size:16px;
      color:var(--brown);
      font-weight:700;
    }
    .divider{
      height:1px;
      background:var(--brown);
      opacity:0.12;
      margin:14px 0;
    }

    /* ===== main categories (big icons) ===== */
    .main-categories{
      display:flex;
      gap:12px;
      justify-content:space-between;
      align-items:center;
      margin-bottom:8px;
    }
    .main-categories .cat{
      width:72px;
      text-align:center;
      cursor:pointer;
      user-select:none;
    }
    .main-categories .cat .avatar{
      width:68px;
      height:68px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      margin:0 auto;
      transition:0.18s;
      background:var(--green); /* الافتراضي */
    }
    .main-categories .cat img{
      width:62%;
      height:62%;
      object-fit:contain;
      display:block;
    }
    .main-categories .cat span{
      display:block;
      margin-top:6px;
      font-size:13px;
      color:#4c632b;
      font-weight:600;
    }
    .main-categories .cat.active .avatar{
      background:var(--blue); /* active حسب طلبك */
    }

    /* ===== Sort by - stars (SVG used) ===== */
    .sort-by{
      display:flex;
      align-items:center;
      gap:12px;
    }
    .sort-by .label{font-weight:600; color:var(--brown); font-size:15px;}
    .stars{
      display:flex;
      gap:6px;
      align-items:center;
      direction:ltr; /* النجوم تمتلئ من اليسار لليمين */
    }
    .star{
      width:24px;
      height:24px;
      cursor:pointer;
      transition:transform .12s;
    }
    .star svg{
      width:100%;
      height:100%;
    }
    .star .path{
      fill: none;
      stroke: var(--green);
      stroke-width:1.6;
    }
    .star.active .path{
      fill: var(--green);
    }

    /* ===== small category buttons (9 buttons) ===== */
    .small-categories{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:6px;
    }
    .small-categories button{
      padding:8px 12px;
      border-radius:18px;
      border: none;
      background:var(--blue); /* default non-active */
      color:var(--white);
      font-size:13px;
      cursor:pointer;
    }
    .small-categories button.active{
      background:var(--green); /* active */
      color:#fff;
    }

    /* ===== price section ===== */
    .price-label{ color:var(--green); font-weight:700; margin-top:6px; margin-bottom:8px; }
    .range-wrap{ padding:6px 0 0; }
    input[type="range"]{
      -webkit-appearance:none;
      width:100%;
      height:8px;
      background:#eee;
      border-radius:6px;
      outline:none;
    }
    input[type="range"]::-webkit-slider-thumb{
      -webkit-appearance:none;
      width:30px;
      height:30px;
      border-radius:50%;
      background:var(--green);
      border:4px solid #fff;
      box-shadow:0 1px 4px rgba(0,0,0,0.2);
      cursor:pointer;
      margin-top:-11px;
    }
    .price-markers{
      display:flex;
      justify-content:space-between;
      margin-top:8px;
      color:var(--brown);
      font-size:13px;
    }

    /* ===== Apply button ===== */
    .apply-btn {
      display: block;
      margin: 24px auto 0 auto;
      width: 40%;
      background: var(--green);
      border: none;
      color: #fff;
      padding: 12px;
      border-radius: 26px;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    }

    /* Bottom Navbar for mobile/tablet */
    .bottom-nav {
      display: none; /* hidden by default */
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #93BE55;
      border-top-left-radius: 30px;
      border-top-right-radius: 30px;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.2);
      justify-content: space-around;
      align-items: center;
      padding: 8px 0;
      z-index: 1000;
    }

    .bottom-nav a {
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 1;
      padding: 6px 0;
    }

    .bottom-nav a img {
      width: 24px;
      height: 24px;
      object-fit: contain;
      /* خلي اللون أصلي أبيض */
      filter: none;
      transition: transform 0.3s;
    }

    .bottom-nav a.active img {
      transform: scale(1.2);
    }

    .bottom-nav a:hover img {
      transform: scale(1.1);
    }

    /* Show bottom nav only on tablet/mobile */
    @media (max-width: 1024px) {
      .bottom-nav { display: flex; }
      nav { display: none; } /* يخفي الـ top navbar تمامًا */
    }

    @media (min-width: 1025px) {
      .bottom-nav { display: none; } /* يتأكد انه مخفي على الكمبيوتر */
    }
  </style>
</head>

  <script>
  

    const mainCats = document.querySelectorAll('.main-categories .cat');
    

    mainCats.forEach(cat=>{
      cat.addEventListener('click', ()=>{
        // clear active
        mainCats.forEach(c=> c.classList.remove('active'));
        cat.classList.add('active');
        // set avatar background (handled by CSS .active)
        // renderSmallCats(cat.dataset.cat);
      });
    });

    /* ===== stars behaviour (fill left->right) ===== */
    const starEls = Array.from(document.querySelectorAll('.star'));
    starEls.forEach((el, idx)=>{
      el.addEventListener('click', ()=>{
        starEls.forEach((s,i)=>{
          if(i <= idx) s.classList.add('active');
          else s.classList.remove('active');
        });
      });
    });

    /* ===== price range: show tick values if needed (range already step=1 => 4 stops) ===== */
    const priceRange = document.getElementById('priceRange');
    priceRange.addEventListener('input', ()=> {
      // you can read priceRange.value (0..3) and apply logic when user applies filters
      // console.log('selected price index', priceRange.value);
    });

    /* ===== Apply button ===== */
    document.getElementById('applyBtn').addEventListener('click', ()=>{
      const selectedMain = document.querySelector('.main-categories .cat.active')?.dataset.cat || 'snacks';
      const selectedSmall = Array.from(document.querySelectorAll('.small-categories button.active')).map(b=>b.dataset.name).join(',');
      const starsCount = document.querySelectorAll('.star.active').length;
      const priceIndex = priceRange.value;
      
      // نرسل القيم كـ GET parameters
      const params = new URLSearchParams({
        main: selectedMain,
        stars: starsCount,
        price: priceIndex
      });
      
      window.location.href = "filter-result.php?" + params.toString();
    });

  </script>
