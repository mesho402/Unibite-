<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
  <title>UniBite - Get Started</title>
  <style>
    body {
      margin: 0;
      background-color: #e8f5ff;
      font-family: "League Spartan", sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    img {
      width: 250px;
      height: auto;
      margin-bottom: 10px;
    }

    p {
      font-size: 14px;
      color: #333;
      margin-bottom: 40px;
    }

    .btn {
      width: 160px;
      border: none;
      border-radius: 25px;
      padding: 12px 0;
      font-size: 16px;
      font-weight: bold;
      margin: 8px 0;
      cursor: pointer;
    }

    .login {
      background-color: #93BE55;
      color: #2672C3;
    }

    .signup {
      background-color: #2672C3;
      color: #93BE55;
    }

    .btn:hover {
      opacity: 0.95;
    }
  </style>
</head>
<body>
  <img src="imgs/unibite-logo.png" alt="UniBite Logo" />

  <p>simplify your campus meals with UniBite!</p>

  <button class="btn login" onclick="location.href='onboarding1.html'">Log In</button>
  <button class="btn signup" onclick="location.href='onboarding1.html'">Sign Up</button>
</body>
</html>
