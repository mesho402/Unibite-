<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
  <title>Onboarding 3</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "League Spartan", sans-serif;
      background-color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100vh;
      text-align: center;
      overflow: hidden;
    }

    .top {
      position: relative;
    }

    .top img {
      width: 100%;
      height: 60vh;
      object-fit: cover;
    }

    .skip {
      position: absolute;
      top: 20px;
      right: 20px;
      color: #f8f8f8;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
    }

    .bottom {
      background-color: #fff;
      border-top-left-radius: 25px;
      border-top-right-radius: 25px;
      padding: 30px 20px 50px;
      position: relative;
      top: -20px;
    }

    .icon {
      width: 40px;
      height: 40px;
      margin-bottom: 15px;
    }

    h2 {
      color: #93BE55;
      margin: 0;
      font-size: 20px;
      font-weight: bold;
    }

    p {
      color: #333;
      font-size: 14px;
      margin: 10px 0 30px;
    }

    .dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 30px;
    }

    .dot {
      width: 25px;
      height: 4px;
      border-radius: 3px;
      background-color: #2672C3;
    }

    .dot:last-child {
      background-color: #93BE55;
    }

    .btn {
      background-color: #93BE55;
      color: white;
      border: none;
      border-radius: 25px;
      padding: 12px 40px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="top">
    <img src="imgs/onborading/onboarding3.png" alt="Coffee" />
    <div class="skip" onclick="location.href='login.html'">Skip ></div>
  </div>

  <div class="bottom">
    <img src="imgs/onborading/fast-pickup.png" alt="Pickup Icon" class="icon" />
    <h2>Fast Pickup</h2>
    <p>Get notified when your order is ready and skip the waiting line</p>

    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot active"></div>
    </div>

    <button class="btn" onclick="location.href='login.html'">Get Started</button>
  </div>
</body>
</html>
