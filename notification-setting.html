<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notification Setting | UniBite</title>
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #93BE55;
      --blue: #2672C3;
      --text: #391713;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "League Spartan", sans-serif;
    }

    body {
      background: var(--blue);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Navbar (Desktop) */
    nav {
      width: 100%;
      background-color: var(--blue);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 40px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    nav .logo img {
      height: 45px;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
      align-items: center;
    }

    .nav-links li a {
      text-decoration: none;
      color: var(--text);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: 0.3s;
      font-size: 15px;
    }

    .nav-links li a img {
      width: 20px;
      height: 20px;
      object-fit: contain;
    }

    .nav-links li a.active,
    .nav-links li a:hover {
      color: var(--blue);
    }

    /* Header */
    .header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 45px 25px 40px;
      color: #F8F8F8;
      background: var(--blue);
    }

    .header h1 {
      font-size: 26px;
      font-weight: 700;
      text-align: center;
      flex: 1;
    }

    .back {
      font-size: 28px;
      font-weight: 600;
      color: #F5F5F5;
      cursor: pointer;
      user-select: none;
    }

    .spacer { width: 28px; }

    /* White Panel */
    .panel {
      background: #fff;
      flex: 1;
      border-top-left-radius: 50px;
      border-top-right-radius: 50px;
      padding: 40px 25px 120px;
      display: flex;
      flex-direction: column;
      color: var(--text);
      max-width: 500px;
      width: 100%;
      margin: 0 auto;
      box-shadow: 0 -4px 8px rgba(0,0,0,0.1);
    }

    /* Setting Rows */
    .toggle-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 0;
      /* border-bottom: 1px solid #eee; */
    }

    .toggle-item span {
      font-size: 17px;
      font-weight: 600;
      color: var(--text);
    }

    /* Toggle Switch */
    .toggle {
      position: relative;
      width: 46px;
      height: 26px;
      border-radius: 50px;
      background: var(--green);
      cursor: pointer;
      transition: background 0.3s;
    }

    .toggle::before {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      transition: all 0.3s ease;
    }

    .toggle.active {
      background: var(--blue);
    }

    .toggle.active::before {
      transform: translateX(20px);
    }

    /* Bottom Navbar */
    .bottom-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: var(--green);
      border-top-left-radius: 25px;
      border-top-right-radius: 25px;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.2);
      justify-content: space-around;
      align-items: center;
      padding: 8px 0;
      z-index: 1000;
    }

    .bottom-nav a {
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 1;
    }

    .bottom-nav a img {
      width: 24px;
      height: 24px;
      object-fit: contain;
      opacity: 0.9;
      transition: transform 0.3s;
    }

    .bottom-nav a.active img {
      transform: scale(1.2);
    }

    @media (max-width: 1024px) {
      nav { display: none; }
      .bottom-nav { display: flex; }
      .panel {
        width: 100%;
        border-radius: 40px 40px 0 0;
        padding-bottom: 130px;
      }
    }

    @media (min-width: 1025px) {
      .bottom-nav { display: none; }
      body {
        align-items: center;
      }
      .panel {
        margin-top: 40px;
        border-radius: 50px;
      }
    }

  </style>
</head>

  <script>
    // Toggle interaction
    document.querySelectorAll('.toggle').forEach(toggle => {
      toggle.addEventListener('click', () => {
        toggle.classList.toggle('active');
      });
    });
  </script>

</html>
